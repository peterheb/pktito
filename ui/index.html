<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pktito</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>

<!-- Setup: choose a model and download it; app.js fills it -->
<section id="setup" class="pk-center" hidden>
  <div class="pk-screen" id="setup-body"></div>
</section>

<!-- Ready: drop files, choose them, or open a recent transcript -->
<section id="ready" class="pk-center" hidden>
  <div class="pk-screen pk-ready">
    <div class="pk-spread">
      <span class="pk-wm">pktito</span>
      <button class="pk-btn pk-btn-ghost" id="ready-model" type="button" aria-haspopup="menu" aria-expanded="false"></button>
    </div>
    <div class="pk-strip pk-strip-idle" aria-hidden="true">
      <span class="pk-tstamp pk-tdim">00:00:00</span>
      <span class="pk-wave is-idle" id="idle-wave"></span>
    </div>
    <div class="pk-ready-text">
      <h1 class="pk-lead">Drop audio or video here</h1>
      <p class="pk-small">mp3, wav, m4a, mp4, mov and more. It stays on this computer.</p>
    </div>
    <div class="pk-ready-act">
      <button class="pk-btn pk-btn-primary pk-btn-lg" id="choose" type="button"></button>
      <span class="pk-kbd" data-kbd="O"></span>
    </div>
    <section class="pk-recent" id="recent" hidden>
      <div class="pk-spread">
        <h2 class="pk-ui">Recent</h2>
        <button class="pk-linkbtn pk-linkbtn-sm" id="clear-recent" type="button">Clear</button>
      </div>
      <ul id="recent-list"></ul>
    </section>
  </div>
</section>

<!-- The work: one file, or the queue beside the one selected -->
<div id="work" class="pk-work" hidden>
  <aside class="pk-side" id="side" hidden>
    <button class="pk-btn pk-add" id="add" type="button"></button>
    <ul class="pk-queue" id="queue" aria-label="Files"></ul>
    <div class="pk-side-foot">
      <span class="pk-small pk-num" id="tally"></span>
      <button class="pk-btn pk-btn-ground" id="save-all" type="button" aria-haspopup="menu" aria-expanded="false"></button>
    </div>
  </aside>
  <section class="pk-main">
    <header class="pk-head">
      <span id="head-ico"></span>
      <h1 class="pk-ui" id="title"></h1>
      <span class="pk-stamp" id="title-dur"></span>
      <span class="pk-grow"></span>
      <label class="pk-find" id="find-box">
        <svg class="pk-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="find" type="search" placeholder="Find in transcript" aria-label="Find in transcript" autocomplete="off" spellcheck="false">
        <span class="pk-kbd" id="find-n"></span>
      </label>
      <button class="pk-btn" id="copy" type="button"></button>
      <button class="pk-btn" id="save-as" type="button" aria-haspopup="menu" aria-expanded="false"></button>
      <button class="pk-btn" id="again" type="button">Start again</button>
      <button class="pk-btn pk-btn-ghost" id="stop" type="button">Stop</button>
      <button class="pk-btn pk-btn-ghost pk-btn-ico" id="remove" type="button"></button>
    </header>
    <div class="pk-strip-wrap" id="strip-wrap">
      <div class="pk-strip" id="strip">
        <button class="pk-play" id="play" type="button"></button>
        <span class="pk-tstamp pk-time" id="time"></span>
        <div class="pk-prog" id="prog"><span class="pk-pct" id="pct"></span><span class="pk-small" id="eta"></span></div>
        <button class="pk-wavebtn" id="wavebtn" type="button"><span class="pk-wave" id="wave"></span></button>
        <span class="pk-tstamp pk-tdim" id="dur"></span>
      </div>
    </div>
    <p class="pk-msg" id="msg" role="status"></p>
    <div class="pk-transcript" id="transcript"></div>
    <footer class="pk-foot">
      <button class="pk-btn pk-btn-ghost" id="foot-model" type="button" aria-haspopup="menu" aria-expanded="false"></button>
      <span class="pk-small" id="took"></span>
      <span class="pk-small pk-hint" id="hint"></span>
    </footer>
  </section>
</div>

<div class="pk-drop" id="drop" hidden>
  <div class="pk-drop-in">
    <div class="pk-strip" aria-hidden="true"><span class="pk-wave" id="drop-wave"></span></div>
    <p class="pk-lead" id="drop-line"></p>
    <ul class="pk-chips" id="drop-names"></ul>
  </div>
</div>
<div class="pk-menu" id="menu" role="menu" hidden></div>
<div class="pk-toast" id="toast" role="status" hidden></div>
<audio id="audio" preload="auto"></audio>

</body>
</html>
