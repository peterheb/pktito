<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pktito</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="app.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <!-- Every word here is ui/locales/en.json's, by the key in its data-t
     attribute (data-t-html for words with markup, data-t-title and the like
     for an attribute's): app.js puts them in at start (localize). -->

    <!-- Setup: choose a model and download it; app.js fills it -->
    <section id="setup" class="pk-center" hidden>
      <div class="pk-dragbar pk-band" data-tauri-drag-region></div>
      <div class="pk-screen" id="setup-body"></div>
    </section>

    <!-- Ready: drop files, choose them, or open a recent transcript -->
    <section id="ready" class="pk-center" hidden>
      <div class="pk-dragbar pk-band" data-tauri-drag-region></div>
      <div class="pk-screen pk-ready">
        <div class="pk-spread" data-tauri-drag-region="deep">
          <button
            class="pk-wm"
            type="button"
            data-about
            data-t-aria-label="about.open"
            data-t-title="about.open"
          >
            pktito
          </button>
          <button
            class="pk-btn pk-btn-ghost"
            id="ready-model"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
          ></button>
        </div>
        <div class="pk-strip pk-strip-idle" aria-hidden="true">
          <div class="pk-lane">
            <span class="pk-wave is-idle" id="idle-wave"></span>
            <div class="pk-times">
              <span class="pk-tstamp pk-tdim">00:00:00</span>
            </div>
          </div>
        </div>
        <div class="pk-ready-text">
          <h1 class="pk-lead" data-t="ready.drop"></h1>
        </div>
        <div class="pk-ready-act">
          <button
            class="pk-btn pk-btn-primary pk-btn-lg"
            id="choose"
            type="button"
          ></button>
        </div>
        <section class="pk-recent" id="recent" hidden>
          <div class="pk-spread">
            <h2 class="pk-ui" data-t="recent.title"></h2>
            <button
              class="pk-btn pk-btn-ghost"
              id="clear-recent"
              type="button"
              data-t-aria-label="recent.clear_label"
              data-t="recent.clear"
            ></button>
          </div>
          <ul id="recent-list"></ul>
        </section>
      </div>
    </section>

    <!-- The work: one file, alone or opened from a batch -->
    <div id="work" class="pk-work" hidden>
      <section class="pk-main">
        <header class="pk-head" data-tauri-drag-region="deep">
          <button
            class="pk-btn pk-btn-ghost pk-btn-ico pk-back"
            id="back"
            type="button"
            data-t-aria-label="nav.back"
          ></button>
          <h1 class="pk-ui" id="title"></h1>
          <span class="pk-spin" id="spin" hidden aria-hidden="true"></span>
          <span class="pk-grow"></span>
          <label class="pk-find" id="find-box">
            <svg class="pk-ico" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              id="find"
              type="search"
              data-t-placeholder="find.placeholder"
              data-t-aria-label="find.label"
              autocomplete="off"
              spellcheck="false"
            />
            <span class="pk-kbd" id="find-n" aria-live="polite"></span>
            <button
              class="pk-find-step"
              id="find-prev"
              type="button"
              data-t-aria-label="find.previous"
            ></button>
            <button
              class="pk-find-step"
              id="find-next"
              type="button"
              data-t-aria-label="find.next"
            ></button>
          </label>
          <button class="pk-btn pk-btn-ico" id="copy" type="button"></button>
          <button
            class="pk-btn"
            id="save-as"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
          ></button>
          <button
            class="pk-btn"
            id="again"
            type="button"
            data-t="work.again"
          ></button>
          <button
            class="pk-btn pk-btn-ghost"
            id="stop"
            type="button"
            data-t="work.stop"
          ></button>
        </header>
        <div class="pk-strip-wrap" id="strip-wrap">
          <div class="pk-strip" id="strip">
            <!-- play, and under it playback's speed, on the line of the times -->
            <div class="pk-transport" id="transport">
              <button class="pk-play" id="play" type="button"></button>
              <button
                class="pk-tstamp pk-speed"
                id="speed"
                type="button"
                aria-haspopup="menu"
                aria-expanded="false"
              ></button>
            </div>
            <div class="pk-prog" id="prog">
              <span class="pk-pct" id="pct"></span
              ><span class="pk-small pk-num" id="pace"></span>
            </div>
            <!-- the waveform the strip's width, a tick under it for each match of a search, and the times below -->
            <div class="pk-lane">
              <button class="pk-wavebtn" id="wavebtn" type="button">
                <span class="pk-wave" id="wave"></span>
              </button>
              <div class="pk-ticks" id="ticks" aria-hidden="true"></div>
              <div class="pk-times">
                <button
                  class="pk-tstamp pk-timebtn"
                  id="time"
                  type="button"
                  aria-haspopup="menu"
                  aria-expanded="false"
                ></button
                ><span class="pk-tstamp pk-tdim" id="dur"></span>
              </div>
            </div>
          </div>
        </div>
        <!-- a finished transcript as its sentences or as its subtitle track's cues -->
        <div
          class="pk-views"
          id="views"
          role="radiogroup"
          data-t-aria-label="work.views_label"
          hidden
        >
          <button
            class="pk-view"
            type="button"
            role="radio"
            data-view="sentences"
            data-t="work.sentences"
          ></button>
          <button
            class="pk-view"
            type="button"
            role="radio"
            data-view="captions"
            data-t="work.captions"
          ></button>
        </div>
        <p class="pk-msg" id="msg" role="status"></p>
        <div class="pk-transcript" id="transcript"></div>
      </section>
    </div>

    <!-- A batch: two or more files at once, under the header row a file's screen
     has, so that the way back and the name stay where they are between the
     two: Stop and Save all for every transcript in it; how far it has got
     over the files' rows, each with its progress and opening its file -->
    <div id="batch" class="pk-work" hidden>
      <section class="pk-main">
        <header class="pk-head" data-tauri-drag-region="deep">
          <button
            class="pk-btn pk-btn-ghost pk-btn-ico pk-back"
            id="batch-back"
            type="button"
            data-t-aria-label="nav.back"
          ></button>
          <h1 class="pk-ui" id="batch-title"></h1>
          <span
            class="pk-spin"
            id="batch-spin"
            hidden
            aria-hidden="true"
          ></span>
          <span class="pk-grow"></span>
          <button
            class="pk-btn pk-btn-ghost"
            id="batch-stop"
            type="button"
            data-t="batch.stop"
          ></button>
          <button
            class="pk-btn pk-btn-primary"
            id="save-all"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
          ></button>
        </header>
        <div class="pk-batch">
          <div class="pk-batch-files">
            <p class="pk-small pk-num" id="tally" role="status"></p>
            <ul id="queue" data-t-aria-label="batch.files_label"></ul>
          </div>
          <button class="pk-btn pk-batch-add" id="add" type="button"></button>
        </div>
      </section>
    </div>

    <!-- About: the credits beside the mascot, over the screen that opened it;
     app.js adds the version, and mascot.js the mascot -->
    <section id="about" class="pk-about" data-t-aria-label="about.open" hidden>
      <div class="pk-dragbar" data-tauri-drag-region></div>
      <button
        class="pk-btn pk-btn-ghost pk-btn-ico pk-back"
        id="about-back"
        type="button"
        data-t-aria-label="nav.back"
      ></button>
      <div class="pk-about-stage" id="about-stage">
        <canvas
          id="mascot"
          tabindex="0"
          role="img"
          data-t-aria-label="about.mascot"
        ></canvas>
      </div>
      <div class="pk-about-text">
        <div class="pk-about-in">
          <h1 class="pk-wm pk-wm-lg">pktito</h1>
          <p class="pk-text" data-t-html="about.tagline_html"></p>
          <p class="pk-small">
            <span id="about-version"></span><br />
            <span data-t-html="about.copyright_html"></span><br />
            <span class="pk-about-links">
              <a href="https://pktito.net/docs" data-t="about.docs"></a>
              <button
                class="pk-linkbtn pk-linkbtn-sm"
                id="privacy-open"
                type="button"
                aria-haspopup="dialog"
                data-t="about.privacy"
              ></button>
              <a href="https://github.com/peterheb/pktito-app">GitHub</a>
            </span>
          </p>
          <dl class="pk-credits">
            <dt>Parakeet-TDT</dt>
            <dd data-t-html="about.models_html"></dd>
            <dt>Silero VAD</dt>
            <dd>
              <span data-t-html="about.silero_html"></span><br />
              Copyright (c) 2020-present Silero Team
            </dd>
            <dt data-t="about.else"></dt>
            <dd>
              <span data-t="about.else_list"></span><br />
              <button
                class="pk-linkbtn pk-linkbtn-sm"
                id="notices-open"
                type="button"
                aria-haspopup="dialog"
                data-t="about.licenses"
              ></button>
            </dd>
          </dl>
        </div>
      </div>
      <!-- Privacy: what leaves this computer, over About, as the licenses are -->
      <div class="pk-notices" id="privacy" hidden>
        <div
          class="pk-notices-box pk-privacy-box"
          role="dialog"
          aria-modal="true"
          aria-labelledby="privacy-title"
        >
          <div class="pk-notices-head">
            <h2 class="pk-ui" id="privacy-title" data-t="privacy.title"></h2>
            <button
              class="pk-btn pk-btn-ghost pk-btn-ico"
              id="privacy-close"
              type="button"
              data-t-aria-label="sheet.close"
            ></button>
          </div>
          <div
            class="pk-notices-body pk-privacy"
            id="privacy-body"
            tabindex="0"
            data-t-aria-label="privacy.label"
          >
            <p data-t="privacy.intro"></p>
            <h3 data-t="privacy.internet"></h3>
            <p data-t-html="privacy.download_html"></p>
            <p data-t-html="privacy.links_html"></p>
            <h3 data-t="privacy.choices"></h3>
            <ul>
              <li data-t="privacy.choice_file"></li>
              <li data-t="privacy.choice_clear"></li>
              <li id="privacy-uninstall" data-t="privacy.choice_uninstall"></li>
            </ul>
            <h3 data-t="privacy.questions"></h3>
            <p data-t-html="privacy.ask_html"></p>
            <p class="pk-small" data-t="privacy.updated"></p>
          </div>
        </div>
      </div>
      <!-- Open source licenses: what pktito is built from, over About; app.js
       fills it from notices.js, which scripts/notices.py makes -->
      <div class="pk-notices" id="notices" hidden>
        <div
          class="pk-notices-box"
          role="dialog"
          aria-modal="true"
          aria-labelledby="notices-title"
        >
          <div class="pk-notices-head">
            <h2 class="pk-ui" id="notices-title" data-t="notices.title"></h2>
            <button
              class="pk-btn pk-btn-ghost pk-btn-ico"
              id="notices-close"
              type="button"
              data-t-aria-label="sheet.close"
            ></button>
          </div>
          <div
            class="pk-notices-body"
            id="notices-body"
            tabindex="0"
            data-t-aria-label="notices.label"
          ></div>
        </div>
      </div>
    </section>

    <!-- Before the recent list is cleared: Cancel the default, its buttons in
     the platform's order (app.js, askClear) -->
    <div class="pk-ask" id="ask" hidden>
      <div
        class="pk-ask-box"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="ask-title"
        aria-describedby="ask-text"
        tabindex="-1"
      >
        <h2 class="pk-ui" id="ask-title" data-t="ask.clear_title"></h2>
        <p id="ask-text" data-t="ask.clear_text"></p>
        <div class="pk-ask-btns" id="ask-btns">
          <button
            class="pk-btn pk-btn-del"
            id="ask-yes"
            type="button"
            data-t="ask.clear"
          ></button>
          <button
            class="pk-btn pk-btn-primary"
            id="ask-no"
            type="button"
            data-t="ask.cancel"
          ></button>
        </div>
      </div>
    </div>

    <div class="pk-drop" id="drop" hidden>
      <div class="pk-drop-in">
        <div class="pk-strip" aria-hidden="true">
          <span class="pk-wave" id="drop-wave"></span>
        </div>
        <p class="pk-lead" id="drop-line"></p>
        <ul class="pk-chips" id="drop-names"></ul>
      </div>
    </div>
    <div class="pk-menu" id="menu" role="menu" hidden></div>
    <!-- On Windows the window's caption buttons, which the page draws (app.js) -->
    <div class="pk-caption" id="caption" hidden>
      <button
        class="pk-cap"
        id="cap-min"
        type="button"
        tabindex="-1"
        data-t-aria-label="window.minimize"
        data-t-title="window.minimize"
      >
        &#xE921;
      </button>
      <button
        class="pk-cap"
        id="cap-max"
        type="button"
        tabindex="-1"
        data-t-aria-label="window.maximize"
        data-t-title="window.maximize"
      >
        &#xE922;
      </button>
      <button
        class="pk-cap pk-cap-close"
        id="cap-close"
        type="button"
        tabindex="-1"
        data-t-aria-label="window.close"
        data-t-title="window.close"
      >
        &#xE8BB;
      </button>
    </div>
    <div class="pk-toast" id="toast" role="status" hidden></div>
    <audio id="audio" preload="auto"></audio>
  </body>
</html>
