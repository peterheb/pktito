[package]
name = "pktito-app"
version = "0.8.2"
description = "pktito: drop an audio or video file, read its transcript. On this computer."
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"

# unoptimized, a debug build hashes the model's download at 28 MB/s
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true

# WebView2's own context menu and accelerator keys, which Tauri does not
# reach (main.rs, tame_webview): wry's versions of the two, so nothing more
# is built
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
