[package]
name = "pktito-app"
version = "0.9.1"
description = "pktito: drop an audio or video file, read its transcript. On this computer."
license = "MIT"
edition = "2021"
publish = false
# the window; src/bin/pktito-cli.rs is the command line, which the bundles
# carry beside it
default-run = "pktito-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
# the app's data folder for pktito-cli, found as Tauri finds it (its dirs)
dirs = "7"

# unoptimized, a debug build hashes the model's download at 28 MB/s
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true

# a .pkf double-clicked while the window is open goes to it, not to a
# second one (main.rs, hand_over); macOS sends open events instead
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# WebView2's own context menu and accelerator keys, which Tauri does not
# reach (main.rs, tame_webview): wry's versions of the two, so nothing more
# is built
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
