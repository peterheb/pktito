[package]
name = "pktito-app"
version = "0.1.0"
description = "pktito: drop an audio or video file, read its transcript. On this computer."
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
