# The Windows Arm64 build, cross-compiled on x64 Windows: Rust's
# aarch64-pc-windows-gnullvm target (and x86_64-pc-windows-gnullvm for the
# host's build scripts, the same C runtime), with llvm-mingw's clang on PATH
# as compiler and linker. Every library is linked statically, so the exe
# needs nothing a Windows install does not have. The x64 build uses
# x86_64-pc-windows-gnu and none of this.
[target.aarch64-pc-windows-gnullvm]
linker = "aarch64-w64-mingw32-clang"
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnullvm]
linker = "x86_64-w64-mingw32-clang"

[env]
CC_aarch64_pc_windows_gnullvm = "aarch64-w64-mingw32-clang"
AR_aarch64_pc_windows_gnullvm = "llvm-ar"
CC_x86_64_pc_windows_gnullvm = "x86_64-w64-mingw32-clang"
AR_x86_64_pc_windows_gnullvm = "llvm-ar"
